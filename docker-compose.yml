services:
  db:
    image: postgres:18-alpine
    container_name: placita-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - placita-net

  nginx:
    image: nginx:alpine
    container_name: placita-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8093:80"
    volumes:
      - /var/www/placita-back:/back:ro
      - /var/www/placita-front:/front:ro
      - ./nginx:/etc/nginx/conf.d
    networks:
      - placita-net

networks:
  placita-net:
    name: placita-net

volumes:
  db_data: